<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3535A0">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Tokyo trip</title>
<style>[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: slim sticky title bar, then the same Tokyo view the app uses. Public page, no login. Tokens copied from the app so the two match. */
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --ink:#1A1930; --muted:#66657D; --line:#E1DFEB;
  --accent:#3535A0; --accent-ink:#FFFFFF; --accent-soft:#E8E8FA;
  --gold:#8A5A00; --gold-soft:#FCEFD0;
  --good:#1E7A4E; --good-soft:#DDF1E6; --bad:#A63A3A; --bad-soft:#F7E0E0;
  --f-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12111C; --surface:#1B1A2A; --ink:#EEEDF8; --muted:#9A99B3; --line:#2C2B42;
  --accent:#A3A6FF; --accent-ink:#12111C; --accent-soft:#272849;
  --gold:#F0B94C; --gold-soft:#3A2F14;
  --good:#6CD19B; --good-soft:#173326; --bad:#F08A8A; --bad-soft:#3A1D1D; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.mark{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.03em;margin:0;line-height:1}
/* the shared tab bar sits under this title bar at every width */
@media (max-width:640px){.tk-tabs{top:calc(var(--tk-top,48px) + env(safe-area-inset-top,0px))!important}}
</style>

<div class="wrap">
  <header class="top"><h1 class="mark">Tokyo trip</h1></header>
  <main id="body"></main>
</div>

<script type="module">
import { mountTokyo } from './tokyo.js';
mountTokyo(document.getElementById('body'));
</script>
</html>
