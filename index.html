<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shortlist</title>
<style>[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3535A0">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: sticky capture header; collection tiles and a shortlist rail on top of an image-led grid; list view for places and food; detail sheet and side-by-side compare. */
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --ink:#1A1930; --muted:#66657D; --line:#E1DFEB;
  --accent:#3535A0; --accent-ink:#FFFFFF; --accent-soft:#E8E8FA;
  --gold:#8A5A00; --gold-soft:#FCEFD0; --star:#E9A21A;
  --good:#1E7A4E; --good-soft:#DDF1E6; --bad:#A63A3A; --bad-soft:#F7E0E0;
  --tile-s:55%; --tile-l1:90%; --tile-l2:82%; --tile-ink:32%;
  --shadow:0 1px 2px rgba(26,25,48,.06),0 10px 28px rgba(26,25,48,.08);
  --f-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12111C; --surface:#1B1A2A; --ink:#EEEDF8; --muted:#9A99B3; --line:#2C2B42;
  --accent:#A3A6FF; --accent-ink:#12111C; --accent-soft:#272849;
  --gold:#F0B94C; --gold-soft:#3A2F14; --star:#F4B83A;
  --good:#6CD19B; --good-soft:#173326; --bad:#F08A8A; --bad-soft:#3A1D1D;
  --tile-s:32%; --tile-l1:26%; --tile-l2:19%; --tile-ink:78%;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12111C; --surface:#1B1A2A; --ink:#EEEDF8; --muted:#9A99B3; --line:#2C2B42;
  --accent:#A3A6FF; --accent-ink:#12111C; --accent-soft:#272849;
  --gold:#F0B94C; --gold-soft:#3A2F14; --star:#F4B83A;
  --good:#6CD19B; --good-soft:#173326; --bad:#F08A8A; --bad-soft:#3A1D1D;
  --tile-s:32%; --tile-l1:26%; --tile-l2:19%; --tile-ink:78%;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mark{font-family:var(--f-display);font-weight:700;font-size:27px;letter-spacing:-.03em;margin:0 6px 0 0;line-height:1}
.views{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.views button{border:0;background:none;padding:5px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.views button.on{background:var(--ink);color:var(--bg)}
.spacer{flex:1}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:500;font-size:13px}
.pillbtn.warn{background:var(--gold-soft);color:var(--gold);border-color:transparent;font-weight:600}
.iconbtn{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:16px}
.add{display:flex;gap:8px;align-items:stretch}
.add .box{flex:1;min-width:0;display:flex;gap:8px}
.add input,.search input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.add #addUrl{flex:2}
.add #addNote{flex:1.2;display:none}
.add.has #addNote{display:block}
.add button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 22px;font-weight:600}
.add button:disabled{opacity:.5;cursor:default}
.search{position:relative}
.search input{padding:9px 14px 9px 38px;border-radius:999px}
.search:before{content:"";position:absolute;left:14px;top:50%;width:11px;height:11px;margin-top:-8px;border:2px solid var(--muted);border-radius:50%}
.search:after{content:"";position:absolute;left:25px;top:50%;width:6px;height:2px;margin-top:5px;background:var(--muted);transform:rotate(45deg)}
@media (max-width:640px){.top{position:static}.brandrow{row-gap:8px}.add.has{flex-wrap:wrap}.add.has .box{flex-wrap:wrap;flex-basis:100%}.add.has #addNote{flex-basis:100%}.add.has button{padding:11px 22px;flex:1}}

/* panels */
.panel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.panel h2{margin:0;font-family:var(--f-display);font-size:17px}
.panel.gold{background:var(--gold-soft);border-color:transparent}
.panel.gold h2{color:var(--gold)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.cols>div{display:grid;gap:8px;align-content:start;min-width:0}
.cols h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cols ol{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.copyrow{display:flex;gap:8px;align-items:stretch;min-width:0}
.copyrow code{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;overflow-x:auto;white-space:nowrap;user-select:all}
.copyrow button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 14px;font-weight:600}
.irow{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.irow a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:13px}
.irow .n{color:var(--muted);font-size:12px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.fine{font-size:12px;color:var(--muted)}

/* chips and filters */
main{display:grid;gap:14px;padding-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:500;white-space:nowrap}
.chip .c{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .c{color:inherit;opacity:.75}
.tops{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none}
.tops::-webkit-scrollbar{display:none}
.tops .chip{font-family:var(--f-display);font-size:15px}
.subs .chip{font-size:13px;padding:4px 11px}
.crumb{border:0;background:none;color:var(--muted);padding:2px 0;font-size:13px}
.crumb:hover{color:var(--ink)}
.sep{color:var(--line)}
.filters{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fgroup{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fgroup select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;font-size:13px}
.tgl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.tag-x{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:13px}
.occ{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.occ::-webkit-scrollbar{display:none}
.occ .chip{font-size:13px;padding:4px 11px}
.sec{display:flex;align-items:baseline;gap:10px;margin:8px 0 -2px}
.sec h2{margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.sec .fine{margin-left:auto}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.coll{border:0;background:none;padding:0;text-align:left;display:grid;gap:8px;min-width:0}
.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:1.25;border-radius:16px;overflow:hidden;background:var(--line);box-shadow:var(--shadow);transition:transform .2s}
.collage.one{grid-template-columns:1fr;grid-template-rows:1fr}
.collage.two{grid-template-rows:1fr}
.collage.three>:first-child{grid-row:span 2}
.coll:hover .collage{transform:translateY(-2px)}
.cell{position:relative;overflow:hidden;min-height:0}
.cell,.pw,.rthumb,.mini .p,.ctab .ph,.shimg{container-type:size}
.embedbox iframe{width:100%;height:560px;border:0;border-radius:14px;margin-top:10px;background:var(--surface)}
.sp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100cqw,80cqh);aspect-ratio:4/5;background-size:500% 500%;background-repeat:no-repeat}
.cell img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.coll b{font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.15}
.coll span.s{color:var(--muted);font-size:13px}

/* tiles for items with no photo */
.tile{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px;letter-spacing:-.02em;
  color:hsl(var(--h) 45% var(--tile-ink));background:linear-gradient(150deg,hsl(var(--h) var(--tile-s) var(--tile-l1)),hsl(calc(var(--h) + 34) var(--tile-s) var(--tile-l2)))}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:22px 16px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;border-radius:14px}
.pw{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:14px;overflow:hidden;background:var(--accent-soft);box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.card:hover .pw{transform:translateY(-3px)}
.pw img{width:100%;height:100%;object-fit:cover;display:block}
.sel .pw{outline:3px solid var(--accent);outline-offset:-3px}
.pills{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 52px)}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface);color:var(--ink);letter-spacing:.02em}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.dn{background:var(--good-soft);color:var(--good)}
.star{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:16px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.star.on{color:var(--star)}
.tick{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center;font-weight:700}
.tick.on{background:var(--accent);color:var(--accent-ink)}
.meta{display:grid;gap:2px;min-width:0}
.brand{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.title{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price b{font-weight:600}
.price s{color:var(--muted);font-size:13px}
.price i{font-style:normal;color:var(--good);font-size:12px;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.rail{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
.rail .card{flex:0 0 168px;scroll-snap-align:start}

/* list layout */
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row.sel{outline:2px solid var(--accent)}
.rthumb{position:relative;width:60px;aspect-ratio:4/5;border-radius:9px;overflow:hidden;background:var(--accent-soft)}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rthumb .tile{font-size:24px}
.rend{display:flex;align-items:center;gap:10px;text-align:right}
.rend .star{position:static;box-shadow:none;border:1px solid var(--line)}

.more-btn{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 22px;font-weight:600}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink);text-decoration:none;text-align:left;max-width:100%;overflow-wrap:anywhere}
.kids{display:grid;gap:6px}
.kid{display:grid;gap:1px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.kid b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);margin:0 0 6px;font-size:19px}
.skel{aspect-ratio:4/5;border-radius:14px;background:var(--line);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}

/* brands */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;height:104px;border-radius:10px;overflow:hidden;margin-bottom:6px;background:var(--line)}
.strip .cell{min-height:0}
.bcard h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;padding:0 4px}
.bcard .sub,.bcard p{padding:0 4px}
.bcard .sub a{color:var(--accent)}
.bcard p{margin:0;font-size:13px}
.bcard .tag-x{justify-self:start;margin:4px 4px 0}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(8,8,18,.55);z-index:10}
#sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:11;background:var(--surface);box-shadow:-14px 0 44px rgba(0,0,0,.3);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slidein .26s ease-out}
@keyframes slidein{from{transform:translateX(28px)}}
@keyframes slideup{from{transform:translateY(40px)}}
@media (max-width:640px){.shimg{max-height:42vh}#sheet{top:5vh;left:0;width:100%;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);animation-name:slideup}}
.sh{padding:12px max(16px,env(safe-area-inset-left,0px)) 32px 16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grab{display:none;width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto -4px}
@media (max-width:640px){.grab{display:block}}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-top .nav{display:flex;gap:6px}
.sq{border:1px solid var(--line);background:none;border-radius:999px;width:34px;height:34px;font-size:17px;line-height:1;display:grid;place-items:center}
.sq:disabled{opacity:.35;cursor:default}
.shimg{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;max-height:54vh;width:100%;background:var(--accent-soft)}
.shimg img{width:100%;height:100%;object-fit:cover;display:block}
.shimg .tile{font-size:80px}
.sh h2{font-family:var(--f-display);font-size:24px;line-height:1.15;letter-spacing:-.01em;margin:2px 0 0;text-wrap:balance}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.go{display:block;text-decoration:none;background:var(--accent);color:var(--accent-ink);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center}
.facts{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts .full{grid-column:1/-1}
.sh textarea,.sh input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0}
.sh textarea{min-height:80px;resize:vertical}
.danger{border:0;background:none;color:var(--bad);text-align:left;padding:4px 0;font-weight:500}
.more{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mini{flex:0 0 92px;border:0;background:none;padding:0;text-align:left;display:grid;gap:4px;min-width:0}
.mini .p{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--accent-soft)}
.mini .p img{width:100%;height:100%;object-fit:cover;display:block}
.mini .p .tile{font-size:26px}
.mini span{font-size:12px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* compare */
#cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:slideup .2s ease-out}
#cmpbar button{border:0;border-radius:999px;padding:8px 16px;font-weight:600}
#cmpbar .go2{background:var(--accent);color:var(--accent-ink)}
#cmpbar .go2:disabled{opacity:.45}
#cmpbar .x2{background:transparent;color:inherit;opacity:.8}
#cmp{position:fixed;inset:0;z-index:12;background:var(--bg);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#cmp .hd{display:flex;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto 14px}
#cmp h2{margin:0;font-family:var(--f-display);font-size:22px}
.ctab{border-collapse:separate;border-spacing:0;margin:0 auto;min-width:100%}
.cwrap{max-width:1280px;margin:0 auto;overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.ctab th,.ctab td{padding:12px 14px;text-align:left;vertical-align:top;font-size:14px;border-bottom:1px solid var(--line);min-width:180px;overflow-wrap:anywhere}
.ctab th.l{position:sticky;left:0;background:var(--surface);min-width:96px;max-width:110px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);z-index:1}
.ctab tr:last-child>*{border-bottom:0}
.ctab .ph{width:150px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;position:relative;background:var(--accent-soft)}
.ctab .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ctab .best{color:var(--good);font-weight:600}
.ctab a{color:var(--accent)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
body.cmpon #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <h1 class="mark">Shortlist</h1>
      <nav class="views" aria-label="View"><button id="vItems" class="on" type="button">Saved</button><button id="vBrands" type="button">Brands</button><button id="vTokyo" type="button">Tokyo</button></nav>
      <span class="spacer"></span>
      <button id="inboxBtn" class="pillbtn warn" type="button" hidden></button>
      <button id="capBtn" class="pillbtn" type="button" aria-expanded="false">Add from anywhere</button>
      <button id="themeBtn" class="pillbtn iconbtn" type="button" aria-label="Switch light or dark">◐</button>
    </div>
    <form id="addForm" class="add" autocomplete="off">
      <div class="box">
        <input id="addUrl" type="text" inputmode="url" placeholder="Paste a link to save (several at once is fine)" aria-label="Link to save">
        <input id="addNote" type="text" placeholder="Note: Diwali, Bandra, for mom (optional)" aria-label="Note for these links">
      </div>
      <button id="addBtn" type="submit">Save</button>
    </form>
    <div class="search"><input id="q" type="search" placeholder="Search your list" aria-label="Search"></div>
  </header>
  <section id="capPanel" class="panel" hidden></section>
  <section id="inboxPanel" class="panel gold" hidden></section>
  <main>
    <div id="tops" class="chips tops"></div>
    <div id="subs" class="chips subs"></div>
    <div id="filters" class="filters"></div>
    <div id="occ" class="occ"></div>
    <div id="body"></div>
  </main>
</div>
<div id="cmpbar" hidden></div>
<div id="cmp" hidden></div>
<div id="scrim" hidden></div>
<aside id="sheet" hidden aria-label="Details"></aside>
<div id="toast" role="status"></div>

<script type="module">
import { boot, SHEET_BASE } from './supa.js';
import { mountTokyo } from './tokyo.js';
(async function () {
  const TOPS = ['Wear', 'Home & Decor', 'Gifts', 'Eat & Drink', 'Places & Stays', 'Ideas & Tips', 'Kids', 'Services & Vendors', 'Art', 'Games & Fun', 'Music & Artists', 'Beauty', 'Tech', 'Other'];
  const GO_TOPS = ['Eat & Drink', 'Places & Stays'];
  const TIP_TOPS = ['Ideas & Tips'];
  const BANDS = [['u5', 'Under ₹5k', 0, 5000], ['5', '₹5k to ₹10k', 5000, 10000], ['10', '₹10k to ₹20k', 10000, 20000], ['20', '₹20k and up', 20000, Infinity]];
  /* replaceChildren takes nodes, not arrays: let it accept nested lists and skip empty slots */
  const rc = Element.prototype.replaceChildren;
  Element.prototype.replaceChildren = function (...k) { return rc.apply(this, k.flat(Infinity).filter(c => c != null && c !== false)); };
  const $ = s => document.querySelector(s);
  const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const fmt = n => n == null ? '' : '₹' + Math.round(n).toLocaleString('en-IN');
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u || ''; } };
  const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
  const hue = s => { let h = 7; for (const c of String(s || '?')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const imgOf = i => i.image && (/^(https?:|data:|sp:|img:)/.test(i.image) || i.image.charAt(0) === '/') ? i.image : null;
  const dateOf = s => s ? new Date(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
    return e;
  }
  /* photo, or a generated colour tile with the initial when there is none */
  function vis(i) {
    const src = imgOf(i);
    if (src && src.slice(0, 3) === 'sp:') { /* sprite cell: sp:<url>|<col>|<row> on a 5x5 sheet of 4:5 cells */
      const p = src.slice(3).split('|');
      return el('span', { class: 'sp', style: 'background-image:url(' + SHEET_BASE + p[0] + '.jpg);background-position:' + (p[1] * 25) + '% ' + (p[2] * 25) + '%' });
    }
    if (src && src.slice(0, 4) === 'img:') return el('img', { src: SHEET_BASE + 'img-' + src.slice(4) + '.jpg', alt: '', loading: 'lazy' });
    if (src) return el('img', { src, alt: '', loading: 'lazy' });
    return el('span', { class: 'tile', style: '--h:' + hue(i.brand || i.title), text: ((i.brand || i.title || '?').trim()[0] || '?').toUpperCase() });
  }

  /* the real Instagram post, shown on demand inside the sheet (no stored photo needed) */
  function igEmbed(i) {
    const m = i.src === 'ig' && !i.parent && /instagram\.com\/(p|reel|tv)\/([\w-]+)/.exec(i.url || '');
    if (!m) return null;
    const box = el('div', { class: 'embedbox' });
    const btn = el('button', { type: 'button', class: 'pillbtn', text: 'Show the post here', onclick: () => {
      if (box.firstChild) { box.replaceChildren(); btn.textContent = 'Show the post here'; return; }
      box.append(el('iframe', { src: 'https://www.instagram.com/' + m[1] + '/' + m[2] + '/embed/', loading: 'lazy', allowtransparency: 'true', scrolling: 'no', title: 'Instagram post' }));
      btn.textContent = 'Hide post';
    } });
    return el('div', null, btn, box);
  }

  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

  let db = null, user = null, myId = null, canWrite = true;
  try { const b = await boot(); if (b) { db = b.db; user = b.user; myId = b.id; } } catch (e) { console.error(e); }

  let items = [], manual = [], ig = [], ov = new Map(), pend = {}, inbox = [], brandDocs = [], loaded = false, captureEmail = '';
  /* saved Instagram posts live in shards (igshards); a person's edits to them live in ov/<id> and win over the shard */
  function rebuild() {
    const all = manual.concat(ig), out = [];
    for (const i of all) { const o = ov.get(i.id); const m = o ? Object.assign({}, i, o) : i; if (!m.hidden) out.push(m); }
    items = out;
  }
  const view = { src: '', limit: 60, allBrands: false, fkey: '', tab: 'items', top: null, sub: [], q: '', occ: null, status: 'open', stockOnly: false, sort: 'new', brand: null, band: null, layout: 'grid',
    sheet: null, inboxOpen: false, capOpen: false, compare: false, cmp: new Set(), cmpOpen: false, order: [] };

  const root = document.documentElement;
  try { const t = localStorage.getItem('sl-theme'); if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t); } catch (e) {}
  try { const l = localStorage.getItem('sl-layout'); if (l === 'list' || l === 'grid') view.layout = l; } catch (e) {}

  function norm(id, d) {
    return Object.assign({ title: 'Untitled', status: 'want', occasions: [], tags: [], facts: [] }, d, { id, path: Array.isArray(d.path) && d.path.length ? d.path : ['Other'] });
  }

  /* ---------- data ---------- */
  const chains = {};
  function upd(id, patch) {
    if (!db) return;
    chains[id] = (chains[id] || Promise.resolve()).then(() => {
        if (id.startsWith('ig-')) { pend[id] = Object.assign({}, pend[id] || ov.get(id) || {}, patch); return db.doc('ov/' + id).set(pend[id]); }
        return db.doc('items/' + id).update(patch);
      })
      .catch(e => toast(e && e.code === 'invalid_argument' ? 'Could not save. You may have view-only access.' : 'Could not save. Try again.'));
    return chains[id];
  }
  function extractUrls(text) {
    const found = (text.match(/https?:\/\/[^\s,]+/gi) || []);
    if (found.length) return [...new Set(found)];
    const t = text.trim();
    if (t && !/\s/.test(t) && /\.[a-z]{2,}/i.test(t)) return ['https://' + t];
    return [];
  }
  async function addLinks(text, note) {
    const urls = extractUrls(text);
    if (!urls.length) { toast('No link found. Paste a full web address.'); return false; }
    try {
      for (const url of urls) await db.collection('inbox').add({ url, note: note || '', addedBy: myId, addedAt: new Date().toISOString() });
      toast(urls.length === 1 ? 'Saved. It will be sorted on the next pass.' : urls.length + ' links saved for sorting.');
      return true;
    } catch (e) { toast('Could not save. You may have view-only access.'); return false; }
  }

  /* ---------- filtering ---------- */
  const STATUS_OPEN = ['want', 'shortlist'];
  function matchQ(i, q) {
    if (!q) return true;
    const hay = [i.title, i.brand, i.owner || '', i.notes, i.path.join(' '), i.occasions.join(' '), i.tags.join(' '), i.facts.join(' ')].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }
  const bandOf = k => BANDS.find(b => b[0] === k);
  function baseFilter(skip) {
    return items.filter(i => {
      if (!matchQ(i, view.q)) return false;
      if (view.status === 'open' && !STATUS_OPEN.includes(i.status)) return false;
      if (view.status === 'done' && i.status !== 'done') return false;
      if (view.status === 'passed' && i.status !== 'passed') return false;
      if (skip !== 'occ' && view.occ && !i.occasions.includes(view.occ)) return false;
      if (skip !== 'band' && view.band) { const b = bandOf(view.band); if (!(b && i.price != null && i.price >= b[2] && i.price < b[3])) return false; }
      if (view.stockOnly && i.stock === 'out') return false;
      if (view.brand && slug(i.brand) !== view.brand) return false;
      if (view.src === 'manual' && i.src === 'ig') return false;
      if (view.src === 'ig' && i.src !== 'ig') return false;
      if (view.src.startsWith('f:') && !(i.folders || []).includes(view.src.slice(2))) return false;
      return true;
    });
  }
  const scopeOf = list => list.filter(i => (!view.top || i.path[0] === view.top) && view.sub.every((p, k) => i.path[k + 1] === p));
  const countBy = (list, fn) => { const m = new Map(); list.forEach(i => { const k = fn(i); if (k != null) m.set(k, (m.get(k) || 0) + 1); }); return m; };
  const statusLabels = top => GO_TOPS.includes(top)
    ? { want: 'To try', shortlist: 'Shortlisted', done: 'Been', passed: 'Passed' }
    : TIP_TOPS.includes(top) ? { want: 'Saved', shortlist: 'Starred', done: 'Used', passed: 'Skip' }
    : { want: 'Want', shortlist: 'Shortlisted', done: 'Bought', passed: 'Passed' };

  /* ---------- top level render ---------- */
  function render() {
    $('#vItems').classList.toggle('on', view.tab === 'items');
    $('#vBrands').classList.toggle('on', view.tab === 'brands');
    $('#vTokyo').classList.toggle('on', view.tab === 'tokyo');
    const tk = view.tab === 'tokyo';
    $('#addForm').hidden = tk || !canWrite;
    $('.search').hidden = tk;
    $('#tops').hidden = tk; $('#filters').hidden = tk;
    if (tk) { $('#subs').hidden = true; $('#occ').hidden = true; }
    const ib = $('#inboxBtn');
    ib.hidden = !inbox.length;
    ib.textContent = inbox.length + ' to sort';
    renderInbox();
    renderCapture();
    if (tk) { $('#tops').replaceChildren(); $('#subs').replaceChildren(); $('#filters').replaceChildren(); $('#occ').replaceChildren(); mountTokyo($('#body')); }
    else if (view.tab === 'brands') renderBrands(); else renderItems();
    renderCmpBar();
    if (view.sheet) { const a = document.activeElement; if (!(a && $('#sheet').contains(a))) renderSheet(); }
    if (view.cmpOpen) renderCmp();
  }

  function copyText(t, label) {
    const fallback = () => toast('Copy blocked. Select the text and copy it by hand.');
    try { navigator.clipboard.writeText(t).then(() => toast(label + ' copied'), fallback); } catch (e) { fallback(); }
  }
  function renderCapture() {
    const p = $('#capPanel');
    p.hidden = !view.capOpen;
    $('#capBtn').setAttribute('aria-expanded', String(!!view.capOpen));
    if (p.hidden) return;
    const bm = "javascript:(function(){location.href='" + location.origin + location.pathname + "?url='+encodeURIComponent(location.href)+'&title='+encodeURIComponent(document.title);})();";
    p.replaceChildren(
      el('h2', { text: 'Add from anywhere' }),
      el('div', { class: 'fine', text: 'Install Shortlist as an app, then use Share from any app and pick Shortlist. The link lands in your list straight away.' }),
      el('div', { class: 'cols' },
        el('div', null, el('h3', { text: 'Pixel: Chrome or Instagram' }),
          el('ol', null, el('li', { text: 'In Chrome open this page, menu, Install app (or Add to Home screen).' }), el('li', { text: 'In Instagram or Chrome tap Share on a post, page or reel, then choose Shortlist.' }), el('li', { text: 'It opens, saves the link and shows it at the top. Sorting happens when you ask Claude.' }))),
        el('div', null, el('h3', { text: 'Mac: Chrome' }),
          el('ol', null, el('li', { text: 'Show the bookmarks bar (Cmd+Shift+B), add any bookmark, edit it and name it Shortlist.' }), el('li', { text: 'Paste the code below into its URL field.' }), el('li', { text: 'On any page, click it. This tab opens with the page saved.' })),
          el('div', { class: 'copyrow' }, el('code', { text: bm }), el('button', { type: 'button', onclick: () => copyText(bm, 'Bookmark code'), text: 'Copy' })))),
      user && user.email ? el('div', { class: 'fine', style: 'margin-top:10px' }, 'Signed in as ' + user.email + ' · ', el('button', { type: 'button', style: 'border:0;background:none;color:var(--accent);padding:0;font:inherit;cursor:pointer', onclick: () => user.signOut(), text: 'Sign out' })) : null);
  }

  function renderInbox() {
    const p = $('#inboxPanel');
    p.hidden = !(view.inboxOpen && inbox.length);
    if (p.hidden) return;
    p.replaceChildren(
      el('h2', { text: 'Waiting to be sorted' }),
      el('div', { class: 'fine', text: 'Ask Claude to sort the Shortlist. It fetches each page, fills in price and details, and files it under the right category.' }),
      inbox.map(r => el('div', { class: 'irow' },
        el('a', { href: safeUrl(r.url), target: '_blank', rel: 'noopener', text: r.url }),
        r.note ? el('span', { class: 'n', text: r.note }) : null,
        canWrite ? el('button', { type: 'button', 'aria-label': 'Remove link', text: '×', onclick: () => db.doc('inbox/' + r.id).delete().catch(() => toast('Could not remove.')) }) : null)));
  }

  /* ---------- saved view ---------- */
  function tileLevel(scope) {
    let pre = [view.top].filter(Boolean).concat(view.sub);
    for (let guard = 0; guard < 8; guard++) {
      const sc = scope.filter(i => pre.every((p, k) => i.path[k] === p));
      const m = countBy(sc, i => i.path[pre.length]);
      if (m.size === 1) { pre = pre.concat([...m.keys()][0]); continue; }
      return { pre, kids: m, sc };
    }
    return { pre, kids: new Map(), sc: [] };
  }

  function renderItems() {
    const topsEl = $('#tops'), subsEl = $('#subs'), fEl = $('#filters'), oEl = $('#occ'), body = $('#body');
    const fkey = [view.top, view.sub.join('>'), view.q, view.occ, view.band, view.status, view.stockOnly, view.brand, view.src, view.sort].join('|');
    if (fkey !== view.fkey) { view.fkey = fkey; view.limit = 60; }
    const b = baseFilter();
    const topCounts = countBy(b, i => i.path[0]);
    const topNames = [...new Set([...TOPS.filter(t => topCounts.has(t)), ...topCounts.keys()])];
    if (view.top && !items.some(i => i.path[0] === view.top)) { view.top = null; view.sub = []; }
    topsEl.replaceChildren(
      el('button', { class: 'chip' + (!view.top ? ' on' : ''), type: 'button', onclick: () => { view.top = null; view.sub = []; render(); } }, 'All', el('span', { class: 'c', text: b.length })),
      topNames.map(t => el('button', { class: 'chip' + (view.top === t ? ' on' : ''), type: 'button', onclick: () => { view.top = t; view.sub = []; render(); } }, t, el('span', { class: 'c', text: topCounts.get(t) }))));

    const scope = scopeOf(b);
    const kids = countBy(scope, i => i.path[view.sub.length + 1]);
    const subKids = [];
    if (view.top) {
      subKids.push(el('button', { class: 'crumb', type: 'button', onclick: () => { view.sub = []; render(); }, text: view.top }));
      view.sub.forEach((p, k) => { subKids.push(el('span', { class: 'sep', text: '›' }), el('button', { class: 'crumb', type: 'button', onclick: () => { view.sub = view.sub.slice(0, k + 1); render(); }, text: p })); });
      if (kids.size) subKids.push(el('span', { class: 'sep', text: '|' }));
      [...kids].sort((a, c) => c[1] - a[1]).forEach(([name, n]) => subKids.push(el('button', { class: 'chip', type: 'button', onclick: () => { view.sub = view.sub.concat(name); render(); } }, name, el('span', { class: 'c', text: n }))));
    }
    subsEl.replaceChildren(subKids);
    subsEl.hidden = !view.top;

    // filters
    const sl = statusLabels(view.top);
    const segBtn = (key, label) => el('button', { type: 'button', class: view.status === key ? 'on' : '', onclick: () => { view.status = key; render(); }, text: label });
    const bandCounts = countBy(scopeOf(baseFilter('band')).filter(i => i.price != null), i => (BANDS.find(x => i.price >= x[2] && i.price < x[3]) || [])[0]);
    const priceSel = bandCounts.size >= 2 || view.band ? el('select', { id: 'bandSel', 'aria-label': 'Price range', onchange: e => { view.band = e.target.value || null; render(); } },
      el('option', { value: '', text: 'Any price' }), BANDS.filter(x => bandCounts.has(x[0]) || view.band === x[0]).map(x => el('option', { value: x[0], selected: view.band === x[0], text: x[1] + ' (' + (bandCounts.get(x[0]) || 0) + ')' }))) : null;
    const sortSel = el('select', { id: 'sortSel', 'aria-label': 'Sort', onchange: e => { view.sort = e.target.value; render(); } },
      [['new', 'Newest'], ['lo', 'Price: low to high'], ['hi', 'Price: high to low']].map(([v, t]) => el('option', { value: v, selected: view.sort === v, text: t })));
    const folderCounts = countBy(items.flatMap(i => (i.folders || []).map(f => ({ f }))), x => x.f);
    const srcSel = items.some(i => i.src === 'ig') ? el('select', { id: 'srcSel', 'aria-label': 'Source', onchange: e => { view.src = e.target.value; render(); } },
      el('option', { value: '', text: 'All sources' }), el('option', { value: 'manual', selected: view.src === 'manual', text: 'Added by you' }), el('option', { value: 'ig', selected: view.src === 'ig', text: 'Instagram saved' }),
      [...folderCounts].sort((a, c) => c[1] - a[1]).map(([f, n]) => el('option', { value: 'f:' + f, selected: view.src === 'f:' + f, text: 'Folder: ' + f + ' (' + n + ')' }))) : null;
    const stockChk = el('input', { type: 'checkbox', id: 'stockChk', onchange: e => { view.stockOnly = e.target.checked; render(); } });
    stockChk.checked = view.stockOnly;
    const lay = (k, t) => el('button', { type: 'button', class: view.layout === k ? 'on' : '', 'aria-label': t, title: t, onclick: () => { view.layout = k; try { localStorage.setItem('sl-layout', k); } catch (e) {} render(); }, text: k === 'grid' ? '▦' : '☰' });
    fEl.replaceChildren(
      el('div', { class: 'fgroup' },
        el('div', { class: 'seg' }, segBtn('open', 'Open'), segBtn('done', sl.done), segBtn('passed', 'Passed'), segBtn('all', 'All')),
        priceSel, srcSel,
        el('label', { class: 'tgl' }, stockChk, 'In stock'),
        view.brand ? el('button', { class: 'tag-x', type: 'button', onclick: () => { view.brand = null; render(); }, text: 'Brand: ' + ((items.find(i => slug(i.brand) === view.brand) || {}).brand || '') + ' ×' }) : null),
      el('div', { class: 'fgroup' },
        el('button', { class: 'pillbtn', type: 'button', style: view.compare ? 'background:var(--accent);color:var(--accent-ink);border-color:var(--accent)' : null, onclick: () => { view.compare = !view.compare; if (!view.compare) view.cmp.clear(); render(); }, text: view.compare ? 'Done comparing' : 'Compare' }),
        el('div', { class: 'seg' }, lay('grid', 'Grid view'), lay('list', 'List view')),
        sortSel));
    const occCounts = countBy(baseFilter('occ').flatMap(i => i.occasions.map(o => ({ o }))), x => x.o);
    oEl.replaceChildren([...occCounts].sort((a, c) => c[1] - a[1]).map(([o, n]) => el('button', { class: 'chip' + (view.occ === o ? ' on' : ''), type: 'button', onclick: () => { view.occ = view.occ === o ? null : o; render(); } }, o, el('span', { class: 'c', text: n }))));
    oEl.hidden = !occCounts.size;

    // sorted list
    const list = scope.slice();
    if (view.sort === 'lo') list.sort((a, c) => (a.price == null ? Infinity : a.price) - (c.price == null ? Infinity : c.price));
    else if (view.sort === 'hi') list.sort((a, c) => (c.price == null ? -1 : c.price) - (a.price == null ? -1 : a.price));
    else list.sort((a, c) => String(c.addedAt || '').localeCompare(String(a.addedAt || '')));
    view.order = list.map(i => i.id);

    const parts = [];
    const plain = !view.q && !view.occ && !view.brand && !view.band && !view.stockOnly;
    if (loaded && db && items.length && plain) {
      const tl = tileLevel(scopeOf(b));
      if (tl.kids.size >= 2) {
        parts.push(el('div', { class: 'sec' }, el('h2', { text: tl.pre.length ? tl.pre.join(' › ') : 'Collections' })));
        parts.push(el('div', { class: 'tiles' }, [...tl.kids].sort((a, c) => c[1] - a[1]).map(([name, n]) => {
          const grp = tl.sc.filter(i => i.path[tl.pre.length] === name);
          const pics = grp.filter(imgOf).slice(0, 4);
          const cells = pics.length ? pics.map(i => el('div', { class: 'cell' }, vis(i))) : [el('div', { class: 'cell' }, el('span', { class: 'tile', style: '--h:' + hue(name), text: name.charAt(0).toUpperCase() }))];
          const cls = 'collage ' + (cells.length === 1 ? 'one' : cells.length === 2 ? 'two' : cells.length === 3 ? 'three' : '');
          return el('button', { class: 'coll', type: 'button', onclick: () => { const full = tl.pre.concat(name); view.top = full[0]; view.sub = full.slice(1); render(); } },
            el('div', { class: cls }, cells), el('b', { text: name }), el('span', { class: 's', text: n + (n === 1 ? ' item' : ' items') }));
        })));
      }

    db.collection('brands').onSnapshot(s => { brandDocs = s.docs.map(d => Object.assign({ id: d.id }, d.data())); if (view.tab === 'brands') render(); }, () => {});
  } else { loaded = true; render(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
